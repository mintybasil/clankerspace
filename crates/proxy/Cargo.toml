[package]
name = "ae-proxy"
version = "0.1.0"
edition = "2024"
description = "MITM egress proxy for agent environments"
license = "MIT"
repository = "https://github.com/mintybasil/ae-poc"

[lib]
name = "ae_proxy"

[[bin]]
name = "ae-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "tls12", "ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
webpki-roots = "0.26"
thiserror = "2"
pem = "3"
time = { version = "0.3", features = ["parsing", "formatting"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
httparse = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"